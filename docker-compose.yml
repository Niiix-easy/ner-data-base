name: neer-data-base

# ─────────────────────────────────────────────────────────────────────
# Pensado para rodar em hardware doméstico modesto (ex: ZimaBoard/ZimaOS).
# Duas coisas foram feitas por causa disso:
#   1. Todas as portas publicadas vêm de variáveis de ambiente (.env),
#      para evitar conflito com portas que o próprio ZimaOS já usa.
#   2. Dados ficam em bind mounts sob ${DATA_PATH} (não volumes nomeados
#      do Docker) — assim aparecem no gerenciador de arquivos do ZimaOS/
#      CasaOS e podem ser copiados/backupeados normalmente.
#   3. `profiles` permitem subir só o essencial em dispositivos com pouca
#      RAM: `docker compose --profile core up -d` já dá um backend
#      funcional (Postgres+Auth+REST+Gateway+Dashboard).
# Ver docs/ZIMAOS.md para o passo a passo completo.
# ─────────────────────────────────────────────────────────────────────

x-postgres-common: &postgres-common
  image: postgres:16-alpine
  environment:
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: neer-data-base
    AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD}
    AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
  volumes:
    - ${DATA_PATH:-./neer-data-base-data}/postgres:/var/lib/postgresql/data
    - ./services/postgres/init:/docker-entrypoint-initdb.d
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres"]
    interval: 5s
    timeout: 5s
    retries: 10
  mem_limit: ${POSTGRES_MEM_LIMIT:-512m}

services:
  # ── Núcleo: PostgreSQL ─────────────────────────────────────────────
  postgres:
    <<: *postgres-common
    container_name: neer-data-base-postgres
    profiles: ["core"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [neer-data-base]

  # ── Connection Pooling (PgBouncer) ──────────────────────────────────
  # NOTA DE PRODUÇÃO: usa AUTH_TYPE=trust + usuário único de backend.
  # Funciona porque REST/GraphQL trocam de role via SET ROLE após
  # conectar (RLS é avaliada pelo role efetivo). Para produção real,
  # prefira Supavisor ou configure scram-sha-256 + userlist.txt.
  pooler:
    image: edoburu/pgbouncer:latest
    container_name: neer-data-base-pooler
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: neer-data-base
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "15"
      AUTH_TYPE: trust
      ADMIN_USERS: postgres
    ports:
      - "${POOLER_PORT:-6432}:6432"
    mem_limit: ${POOLER_MEM_LIMIT:-64m}
    networks: [neer-data-base]

  # ── REST automático a partir das tabelas ───────────────────────────
  rest:
    image: postgrest/postgrest:latest
    container_name: neer-data-base-rest
    profiles: ["core"]
    depends_on:
      pooler:
        condition: service_started
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@pooler:6432/neer-data-base
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_AUD: authenticated
    mem_limit: ${REST_MEM_LIMIT:-128m}
    networks: [neer-data-base]

  # ── Storage (S3-compatible) — opcional, perfil "storage" ────────────
  minio:
    image: minio/minio:latest
    container_name: neer-data-base-minio
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_PATH:-./neer-data-base-data}/minio:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    mem_limit: ${MINIO_MEM_LIMIT:-256m}
    networks: [neer-data-base]

  storage:
    build: ./services/storage
    container_name: neer-data-base-storage
    profiles: ["storage"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neer-data-base
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET}
    ports:
      - "${STORAGE_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${STORAGE_MEM_LIMIT:-128m}
    networks: [neer-data-base]

  # ── Edge Functions runtime — opcional, perfil "functions" ───────────
  functions:
    build: ./services/functions
    container_name: neer-data-base-functions
    profiles: ["core", "functions"]
    environment:
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET}
    ports:
      - "${FUNCTIONS_PORT:-8787}:8787"
    mem_limit: ${FUNCTIONS_MEM_LIMIT:-128m}
    networks: [neer-data-base]

  # ── Message Broker (Kafka) para Billing / Eventos ────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: neer-data-base-kafka
    profiles: ["core"]
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - ${DATA_PATH:-./neer-data-base-data}/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [neer-data-base]

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: neer-data-base-api
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neer-data-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
    command: >
      sh -c "cd /app/packages/database && npx prisma db push && npm run seed && cd ../../apps/api && npm start"
    ports:
      - "3005:3000"
    networks: [neer-data-base]

  worker:
    build:
      context: .
      dockerfile: ./apps/worker/Dockerfile
    container_name: neer-data-base-worker
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neer-data-base
    command: >
      sh -c "cd /app/packages/database && npx prisma db push && cd ../../apps/worker && npm start"
    networks: [neer-data-base]

  # ── GraphQL automático — opcional, perfil "graphql" (serviço pesado) ─
  graphql:
    image: graphile/postgraphile:latest
    container_name: neer-data-base-graphql
    profiles: ["graphql"]
    depends_on:
      pooler:
        condition: service_started
    command:
      - --connection
      - postgres://postgres:${POSTGRES_PASSWORD}@pooler:6432/neer-data-base
      - --schema
      - public
      - --port
      - "5000"
      # Kong tira o prefixo /graphql/v1 antes de encaminhar (strip_path),
      # então a requisição chega na raiz — sem isto, o PostGraphile serviria
      # em /graphql por padrão e todo request via gateway daria 404.
      - --graphql
      - /
      - --jwt-secret
      - ${JWT_SECRET}
      - --default-role
      - anon
    ports:
      - "${GRAPHQL_PORT:-5000}:5000"
    mem_limit: ${GRAPHQL_MEM_LIMIT:-256m}
    networks: [neer-data-base]

  # ── Cache / Fila (Redis) para Workers / Rate Limiting ────────────────
  redis:
    image: redis:alpine
    container_name: neer-data-base-redis
    profiles: ["core"]
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ${DATA_PATH:-./neer-data-base-data}/redis:/data
    mem_limit: ${REDIS_MEM_LIMIT:-64m}
    networks: [neer-data-base]

  # ── API Gateway (entrada única) ──────────────────────────────────────
  kong:
    image: kong:3.6
    container_name: neer-data-base-kong
    profiles: ["core"]
    depends_on: [rest, control-plane, dashboard]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./services/kong/kong.yml:/kong.yml:ro
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    mem_limit: ${KONG_MEM_LIMIT:-256m}
    networks: [neer-data-base]

  # ── Control Plane (orquestração: projetos, orgs, provisioning) ──────
  control-plane:
    build: ./services/control-plane
    container_name: neer-data-base-control-plane
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neer-data-base
      JWT_SECRET: ${JWT_SECRET}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET}
      KONG_ADMIN_URL: http://kong:8001
      # Usado para montar a webhookUrl mostrada ao conectar um repositório
      # GitHub (services/control-plane/src/routes/github-management.js) —
      # sem isso, sempre cairia no fallback "localhost", errado em qualquer
      # acesso feito de fora do próprio servidor.
      PUBLIC_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
    ports:
      - "${CONTROL_PLANE_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${CONTROL_PLANE_MEM_LIMIT:-128m}
    networks: [neer-data-base]

  # ── Dashboard (Studio) ───────────────────────────────────────────────
  # NEXT_PUBLIC_* precisam ser injetadas em BUILD TIME (Next.js embute
  # essas variáveis no bundle do browser) — por isso vêm via `args`, não
  # `environment`. Troque PUBLIC_GATEWAY_URL/PUBLIC_CONTROL_PLANE_URL no
  # .env pelo IP do seu ZimaOS na rede antes do primeiro build.
  dashboard:
    build:
      context: ./services/dashboard
      args:
        NEXT_PUBLIC_CONTROL_PLANE_URL: ${PUBLIC_CONTROL_PLANE_URL:-http://localhost:3001}
        NEXT_PUBLIC_API_GATEWAY_URL: ${PUBLIC_GATEWAY_URL:-http://localhost:8000}
    container_name: neer-data-base-dashboard
    profiles: ["core"]
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/neer-data-base
      STUDIO_ADMIN_EMAIL: ${STUDIO_ADMIN_EMAIL}
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET}
    ports:
      - "${DASHBOARD_PORT:-3010}:3000"
    mem_limit: ${DASHBOARD_MEM_LIMIT:-256m}
    networks: [neer-data-base]

networks:
  neer-data-base:
    driver: bridge
