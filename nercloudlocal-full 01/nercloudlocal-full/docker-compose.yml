services:
  postgres:
    image: postgres:16-alpine
    container_name: neercloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neercloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-neercloud}
    ports:
      - "5432:5432"
    volumes:
      - neercloud_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neercloud} -d ${POSTGRES_DB:-neercloud}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: neercloud-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - neercloud_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: neercloud-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-neercloud}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-neercloud}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STUDIO_ADMIN_PASSWORD: ${STUDIO_ADMIN_PASSWORD:-change-me-now}
      STUDIO_SESSION_SECRET: ${STUDIO_SESSION_SECRET:-change-this-secret}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-NeerCloud Local}
    ports:
      - "${DASHBOARD_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neercloud_postgres:
  neercloud_redis:
